# Shared sub-flow: relaunch and make sure we land on the login screen.
#
# Do NOT use `launchApp: { clearState: true }` on dev-client builds — it wipes
# the stored bundler URL and drops the simulator into the Expo launcher screen.
#
# Do NOT openLink to login while a session may exist — on Android that remounts
# the RN activity.
#
# Sign out sits just above the tab bar on small Android viewports — use
# id: sign-out-button with visibilityPercentage 40 (not text + 80%).
appId: com.beruapp.ai
---
- launchApp:
    clearState: false
- waitForAnimationToEnd:
    timeout: 6000

- extendedWaitUntil:
    visible:
      text: "Dev quick fill|Book now|Quick actions|View public profile|Saved providers|Sign out"
    timeout: 45000

- runFlow:
    when:
      visible: "Book now"
    commands:
      - tapOn:
          id: "tab-account"
          optional: true
      - tapOn:
          text: ".*Account, tab.*"
          optional: true
      - extendedWaitUntil:
          visible: "Saved providers|Sign out|Settings"
          timeout: 15000
      - scrollUntilVisible:
          element:
            id: "sign-out-button"
          direction: DOWN
          centerElement: false
          visibilityPercentage: 40
          speed: 60
          timeout: 25000
      - tapOn:
          id: "sign-out-button"

- runFlow:
    when:
      visible: "Quick actions"
    commands:
      - tapOn:
          id: "tab-profile"
          optional: true
      - tapOn:
          text: ".*Profile, tab.*"
          optional: true
      - extendedWaitUntil:
          visible: "View public profile|Manage services|Sign out"
          timeout: 15000
      - scrollUntilVisible:
          element:
            id: "sign-out-button"
          direction: DOWN
          centerElement: false
          visibilityPercentage: 40
          speed: 60
          timeout: 25000
      - tapOn:
          id: "sign-out-button"

- runFlow:
    when:
      visible: "View public profile"
    commands:
      - scrollUntilVisible:
          element:
            id: "sign-out-button"
          direction: DOWN
          centerElement: false
          visibilityPercentage: 40
          speed: 60
          timeout: 25000
      - tapOn:
          id: "sign-out-button"

- runFlow:
    when:
      visible: "Saved providers"
    commands:
      - scrollUntilVisible:
          element:
            id: "sign-out-button"
          direction: DOWN
          centerElement: false
          visibilityPercentage: 40
          speed: 60
          timeout: 20000
      - tapOn:
          id: "sign-out-button"

- extendedWaitUntil:
    visible: "Dev quick fill"
    timeout: 20000
