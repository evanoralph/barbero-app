# A-03: Forgot password navigation and submit confirmation.
appId: com.beruapp.ai
---
- runFlow: ../../lib/ensure_logged_out.yaml
- tapOn: "Forgot password?"
- assertVisible: "Forgot password"
- tapOn: "Email"
- inputText: "customer@example.test"
- tapOn: "Send reset email"
- extendedWaitUntil:
    visible: ".*email.*"
    timeout: 10000
