# Screens: (auth)/login.tsx, (auth)/forgot-password.tsx, (auth)/reset-password.tsx
appId: com.beruapp.ai
---
- runFlow: lib/ensure_logged_out.yaml
- takeScreenshot: 00_login

- tapOn: "Forgot password?"
- takeScreenshot: 01_forgot_password

# reset-password.tsx takes its token from a deep-link query param (email link in
# real usage) — there's no in-app button that opens it, so we jump straight there.
- openLink: "barbero://(auth)/reset-password"
- takeScreenshot: 02_reset_password
