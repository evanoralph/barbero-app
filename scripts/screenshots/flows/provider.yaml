# Screens: (provider)/index.tsx, bookings/index.tsx, bookings/[id].tsx,
# availability.tsx, messages/index.tsx, messages/[threadId].tsx, profile.tsx,
# services.tsx, portfolio.tsx, subscription.tsx, subscription-payments.tsx,
# payout-settings.tsx, public-profile.tsx
#
# Uses the "Dev quick fill" button (__DEV__ only, see app/(auth)/login.tsx) to
# log in, so this only works against a dev build, not a production build.
#
# Tab taps prefer testID (tab-*) — same on iOS and Android. Regex
# ".*<Label>, tab.*" is a fallback for older builds without testIDs.
#
# Messages / Inbox is NOT a tab (href: null) — open it from Dashboard Quick
# actions ("Inbox"), matching .maestro/flows/provider/inbox.yaml.
#
# Note on nav-stack resets: relaunching the app (launchApp) resets React
# Navigation's in-memory stack to its initial route without logging the user
# out (clearState: false only clears app process state, not the persisted
# auth token) — used here to back out of a pushed detail screen instead of
# relying on a back button, since some detail headers don't render one.
appId: com.beruapp.ai
---
- runFlow: lib/ensure_logged_out.yaml
- runFlow: lib/login_provider.yaml

# Dashboard
- takeScreenshot: 01_dashboard

# Bookings — list, then best-effort into a detail
- tapOn:
    id: "tab-bookings"
    optional: true
- tapOn:
    text: ".*Bookings, tab.*"
    optional: true
- takeScreenshot: 02_bookings_list
- tapOn: ".*Pending.*"
- tapOn:
    point: "50%,30%"
    optional: true
- takeScreenshot: 03_booking_detail
- launchApp:
    clearState: false

# Hours
- tapOn:
    id: "tab-hours"
    optional: true
- tapOn:
    text: ".*Hours, tab.*"
    optional: true
- takeScreenshot: 04_hours

# Inbox — Quick action on Dashboard (messages tab is hidden)
- tapOn:
    id: "tab-dashboard"
    optional: true
- tapOn:
    text: ".*Dashboard, tab.*"
    optional: true
- scrollUntilVisible:
    element: "Inbox"
    direction: DOWN
    centerElement: true
    timeout: 15000
    optional: true
- tapOn:
    text: "Inbox"
    optional: true
- takeScreenshot: 05_inbox_list
- tapOn:
    point: "50%,25%"
    optional: true
- takeScreenshot: 06_message_thread
- launchApp:
    clearState: false

# Profile
- tapOn:
    id: "tab-profile"
    optional: true
- tapOn:
    text: ".*Profile, tab.*"
    optional: true
- takeScreenshot: 07_profile

# Public profile preview (pushed from Profile)
- tapOn: "View public profile"
- takeScreenshot: 11_public_profile
- launchApp:
    clearState: false

# Services (pushed from Profile, below the fold)
- tapOn:
    id: "tab-profile"
    optional: true
- tapOn:
    text: ".*Profile, tab.*"
    optional: true
- scrollUntilVisible:
    element: "Manage services"
    direction: DOWN
    centerElement: true
    visibilityPercentage: 90
    timeout: 25000
    optional: true
- tapOn:
    text: "Manage services"
    optional: true
- takeScreenshot: 08_services
- launchApp:
    clearState: false

# Portfolio (pushed from Profile, below the fold)
- tapOn:
    id: "tab-profile"
    optional: true
- tapOn:
    text: ".*Profile, tab.*"
    optional: true
- scrollUntilVisible:
    element: "Manage portfolio"
    direction: DOWN
    centerElement: true
    visibilityPercentage: 90
    timeout: 25000
    optional: true
- tapOn:
    text: "Manage portfolio"
    optional: true
- takeScreenshot: 09_portfolio
- launchApp:
    clearState: false

# Subscription plan (pushed from Profile, below the fold)
- tapOn:
    id: "tab-profile"
    optional: true
- tapOn:
    text: ".*Profile, tab.*"
    optional: true
- scrollUntilVisible:
    element: "Subscription plan"
    direction: DOWN
    centerElement: true
    visibilityPercentage: 90
    timeout: 25000
    optional: true
- tapOn:
    text: "Subscription plan"
    optional: true
- takeScreenshot: 10_subscription

# Billing history (pushed from subscription)
- scrollUntilVisible:
    element: "View all billing history"
    direction: DOWN
    centerElement: true
    visibilityPercentage: 90
    timeout: 15000
    optional: true
- tapOn:
    text: "View all billing history"
    optional: true
- takeScreenshot: 13_billing_history
- launchApp:
    clearState: false

# Payout settings (pushed from Profile)
- tapOn:
    id: "tab-profile"
    optional: true
- tapOn:
    text: ".*Profile, tab.*"
    optional: true
- scrollUntilVisible:
    element: "Manage payout settings"
    direction: DOWN
    centerElement: true
    visibilityPercentage: 90
    timeout: 25000
    optional: true
- tapOn:
    text: "Manage payout settings"
    optional: true
- takeScreenshot: 12_payout_settings
