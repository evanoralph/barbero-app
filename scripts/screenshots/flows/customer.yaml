# Screens: (customer)/index.tsx, search.tsx, bookings/index.tsx,
# bookings/[id].tsx, messages/index.tsx, messages/[threadId].tsx,
# account/index.tsx, account/settings.tsx, account/saved.tsx,
# account/payments.tsx, provider/[slug].tsx, book/[slug].tsx, map.tsx
#
# See provider.yaml for notes on tab testIDs and launchApp nav-stack resets.
# Messages is NOT a tab (href: null) — open via Home header "Messages" control,
# matching .maestro/flows/customer/messages.yaml.
# Map uses accessibilityLabel "Open full map" on the Home map-pin control.
appId: com.beruapp.ai
---
- runFlow: lib/ensure_logged_out.yaml
- runFlow: lib/login_customer.yaml

# Home
- takeScreenshot: 01_home

# Explore (route file: search.tsx, tab label: Explore)
- tapOn:
    id: "tab-explore"
    optional: true
- tapOn:
    text: ".*Explore, tab.*"
    optional: true
- takeScreenshot: 02_explore

# Provider profile + booking flow (pushed from Explore)
- tapOn:
    point: "50%,55%"
    optional: true
- takeScreenshot: 03_provider_profile
- scrollUntilVisible:
    element: ".*Book with.*"
    direction: DOWN
    centerElement: true
    visibilityPercentage: 90
    timeout: 25000
    optional: true
- tapOn:
    text: ".*Book with.*"
    optional: true
- takeScreenshot: 04_book_flow
- launchApp:
    clearState: false

# Bookings — list, then best-effort into a detail
- tapOn:
    id: "tab-bookings"
    optional: true
- tapOn:
    text: ".*Bookings, tab.*"
    optional: true
- takeScreenshot: 05_bookings_list
- tapOn:
    point: "50%,32%"
    optional: true
- takeScreenshot: 06_booking_detail
- launchApp:
    clearState: false

# Messages — Home header control (messages tab is hidden)
- tapOn:
    id: "tab-home"
    optional: true
- tapOn:
    text: ".*Home, tab.*"
    optional: true
- tapOn:
    text: "Messages"
    optional: true
- takeScreenshot: 07_messages_list
- tapOn:
    point: "50%,25%"
    optional: true
- takeScreenshot: 08_message_thread
- launchApp:
    clearState: false

# Account
- tapOn:
    id: "tab-account"
    optional: true
- tapOn:
    text: ".*Account, tab.*"
    optional: true
- takeScreenshot: 09_account

- tapOn: "Settings"
- takeScreenshot: 10_settings
- tapOn:
    point: "7%,8%"
    optional: true

- tapOn: "Saved providers"
- takeScreenshot: 11_saved
- tapOn:
    point: "7%,8%"
    optional: true

- tapOn: ".*Payments.*"
- takeScreenshot: 12_payments
- launchApp:
    clearState: false

# Map (pushed from Home via the map-pin control)
- tapOn:
    id: "tab-home"
    optional: true
- tapOn:
    text: ".*Home, tab.*"
    optional: true
- tapOn: "Open full map"
- takeScreenshot: 13_map
