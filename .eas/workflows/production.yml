# Production store builds + submit on version tags (v1.0.0, v1.2.3, …).
# Requires GitHub ↔ EAS connection + production credentials:
# https://expo.dev/accounts/evanoralph/projects/barbero-app/github
#
# EAS production env must use HTTPS API (e.g. https://api.beru.digital/api/v1).
# Skip a run with [eas skip], [skip eas], or [no eas] in the tag/commit message.
#
# Manual: npm run eas:production
name: Production build

on:
  push:
    tags:
      - 'v*'

concurrency:
  cancel_in_progress: false
  group: ${{ workflow.filename }}-${{ github.ref }}

defaults:
  tools:
    node: '22.22.3'

jobs:
  typecheck:
    name: Typecheck
    steps:
      - name: Checkout
        uses: eas/checkout

      - name: Install dependencies
        uses: eas/install_node_modules

      - name: Log production workflow start
        run: |
          echo "[ci] production workflow start"
          echo "[ci] profile=production"
          echo "[ci] ref=${{ github.ref_name }}"
          echo "[ci] sha=${{ github.sha }}"
          echo "[ci] event=${{ github.event_name }}"
          echo "[ci] api_host=https://api.beru.digital (set via EAS production env)"
          node --version
          npm --version

      - name: Typecheck
        run: npm run typecheck

      - name: Log typecheck done
        run: echo "[ci] typecheck passed; starting production builds"

  build_android:
    name: Build Android
    needs: [typecheck]
    type: build
    params:
      platform: android
      profile: production

  build_ios:
    name: Build iOS
    needs: [typecheck]
    type: build
    params:
      platform: ios
      profile: production

  submit_android:
    name: Submit Android (Play internal)
    needs: [build_android]
    type: submit
    params:
      platform: android
      profile: production
      build_id: ${{ needs.build_android.outputs.build_id }}

  # Uploads to App Store Connect and adds to the Expo-created internal group.
  testflight:
    name: Submit iOS (TestFlight)
    needs: [build_ios]
    type: testflight
    params:
      profile: production
      build_id: ${{ needs.build_ios.outputs.build_id }}
      internal_groups: ['Team']
      changelog: |
        Production build ${{ github.ref_name }}
        API: https://api.beru.digital/api/v1
