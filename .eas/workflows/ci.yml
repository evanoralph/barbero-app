# CI gate for pull requests and main.
# Requires GitHub ↔ EAS connection:
# https://expo.dev/accounts/evanoralph/projects/barbero-app/github
#
# Skip a run with [eas skip], [skip eas], or [no eas] in the commit message.
name: CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
    types: [opened, reopened, synchronize]

concurrency:
  cancel_in_progress: true
  group: ${{ workflow.filename }}-${{ github.ref }}

defaults:
  tools:
    node: '22.22.3'

jobs:
  typecheck:
    name: Typecheck
    steps:
      - name: Checkout
        uses: eas/checkout

      - name: Install dependencies
        uses: eas/install_node_modules

      - name: Log CI start
        run: |
          echo "[ci] typecheck start"
          echo "[ci] ref=${{ github.ref_name }}"
          echo "[ci] sha=${{ github.sha }}"
          echo "[ci] event=${{ github.event_name }}"
          node --version
          npm --version

      - name: Typecheck
        run: npm run typecheck

      - name: Log CI done
        run: echo "[ci] typecheck passed"

  fingerprint:
    name: Native fingerprint
    needs: [typecheck]
    type: fingerprint
